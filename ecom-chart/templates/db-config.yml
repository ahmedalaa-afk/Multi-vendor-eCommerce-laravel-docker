    -- Table structure for table `coupon`
    CREATE TABLE `coupon` (
      `coupon_id` int(11) NOT NULL AUTO_INCREMENT,
      `coupon_code` varchar(250) NOT NULL,
      `discount_amount` smallint(6) NOT NULL,
      `expiration_date` timestamp NOT NULL DEFAULT current_timestamp() ON UPDATE current_timestamp(),
      `VendorId` int(11) DEFAULT NULL,
      `coupon_status` tinyint(4) DEFAULT 1,
      PRIMARY KEY (`coupon_id`),
      KEY `coupon_vendor_shop_vendor_id_fk` (`VendorId`),
      CONSTRAINT `coupon_vendor_shop_vendor_id_fk` FOREIGN KEY (`VendorId`) REFERENCES `vendor_shop` (`vendor_id`) ON DELETE CASCADE ON UPDATE CASCADE
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_general_ci;

