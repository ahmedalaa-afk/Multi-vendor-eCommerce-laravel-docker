    -- Table structure for table `sub_category`
    CREATE TABLE `sub_category` (
      `sub_category_id` int(11) NOT NULL AUTO_INCREMENT,
      `sub_category_name` varchar(150) NOT NULL,
      `sub_category_image` varchar(250) NOT NULL,
      `category_id` int(11) NOT NULL,
      `sub_category_slug` varchar(150) NOT NULL,
      `created_at` timestamp NOT NULL DEFAULT current_timestamp(),
      PRIMARY KEY (`sub_category_id`),
      KEY `sub_category_category_category_id_fk` (`category_id`),
      CONSTRAINT `sub_category_category_category_id_fk` FOREIGN KEY (`category_id`) REFERENCES `category` (`category_id`) ON DELETE CASCADE ON UPDATE CASCADE
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_general_ci;

