    -- Table structure for table `product_offers`
    CREATE TABLE `product_offers` (
      `offer_id` int(11) NOT NULL AUTO_INCREMENT,
      `hot_deal` tinyint(4) DEFAULT 0,
      `featured_product` tinyint(4) DEFAULT 0,
      `special_offer` tinyint(4) DEFAULT 0,
      `special_deal` tinyint(4) DEFAULT 0,
      `offer_product_id` int(11) DEFAULT NULL,
      PRIMARY KEY (`offer_id`),
      KEY `product_offers_product_product_id_fk` (`offer_product_id`),
      CONSTRAINT `product_offers_product_product_id_fk` FOREIGN KEY (`offer_product_id`) REFERENCES `product` (`product_id`) ON UPDATE CASCADE
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_general_ci;

    INSERT INTO `product_offers` (`offer_id`, `hot_deal`, `featured_product`, `special_offer`, `special_deal`, `offer_product_id`) VALUES
    (1, 1, 0, 1, 0, 1);

    -- Views Structure
    CREATE OR REPLACE VIEW `get_product_data` AS 
    SELECT DISTINCT `product`.`product_id` AS `product_id`, `product`.`product_name` AS `product_name`, `product`.`product_slug` AS `product_slug`, `product`.`product_code` AS `product_code`, `product`.`product_quantity` AS `product_quantity`, `product`.`product_tags` AS `product_tags`, `product`.`product_price` AS `product_price`, `product`.`product_short_description` AS `product_short_description`, `product`.`product_long_description` AS `product_long_description`, `product`.`product_thumbnail` AS `product_thumbnail`, `product`.`product_status` AS `product_status`, `product`.`sub_category_id` AS `sub_category_id`, `product`.`brand_id` AS `brand_id`, `product`.`vendor_id` AS `vendor_id`, `product`.`product_colors` AS `product_colors`, `po`.`offer_id` AS `offer_id`, `po`.`offer_product_id` AS `offer_product_id`, `po`.`hot_deal` AS `hot_deal`, `po`.`featured_product` AS `featured_product`, `po`.`special_offer` AS `special_offer`, `po`.`special_deal` AS `special_deal` 
    FROM (`product` join `product_offers` `po` on(`product`.`product_id` = `po`.`offer_product_id`));

    CREATE OR REPLACE VIEW `get_sub_categories` AS 
    SELECT `sub`.`sub_category_id` AS `sub_category_id`, `sub`.`sub_category_name` AS `sub_category_name`, `sub`.`sub_category_slug` AS `sub_category_slug`, `sub`.`sub_category_image` AS `sub_category_image`, `sub`.`category_id` AS `selected_category_id`, `sub`.`created_at` AS `created_at`, `category`.`category_name` AS `category_name` 
    FROM (`sub_category` `sub` join `category` on(`sub`.`category_id` = `category`.`category_id`));

    CREATE OR REPLACE VIEW `get_vendor_data` AS 
    SELECT `users`.`id` AS `id`, `users`.`photo` AS `photo`, `users`.`name` AS `name`, `users`.`email` AS `email`, `users`.`username` AS `username`, `vendor_shop`.`shop_name` AS `shop_name`, `users`.`created_at` AS `created_at`, `vendor_shop`.`shop_description` AS `shop_description`, `users`.`phone_number` AS `phone_number`, `users`.`address` AS `address`, `vendor_shop`.`vendor_id` AS `vendor_id` 
    FROM (`users` join `vendor_shop` on(`users`.`id` = `vendor_shop`.`user_id`));

    COMMIT;
