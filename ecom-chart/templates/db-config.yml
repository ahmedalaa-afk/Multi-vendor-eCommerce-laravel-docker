    -- Table structure for table `product_images`
    CREATE TABLE `product_images` (
      `image_id` int(11) NOT NULL AUTO_INCREMENT,
      `product_image` varchar(250) NOT NULL,
      `image_product_id` int(11) NOT NULL,
      PRIMARY KEY (`image_id`),
      KEY `product_images_product_product_id_fk` (`image_product_id`),
      CONSTRAINT `product_images_product_product_id_fk` FOREIGN KEY (`image_product_id`) REFERENCES `product` (`product_id`) ON DELETE CASCADE ON UPDATE CASCADE
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_general_ci;

