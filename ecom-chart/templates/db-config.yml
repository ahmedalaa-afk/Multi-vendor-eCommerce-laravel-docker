    -- Table structure for table `vendor_shop`
    CREATE TABLE `vendor_shop` (
      `vendor_id` int(11) NOT NULL AUTO_INCREMENT,
      `shop_name` varchar(200) DEFAULT NULL,
      `shop_description` text DEFAULT NULL,
      `user_id` bigint(20) UNSIGNED NOT NULL,
      PRIMARY KEY (`vendor_id`),
      KEY `vendor_shop_users_id_fk` (`user_id`),
      CONSTRAINT `vendor_shop_users_id_fk` FOREIGN KEY (`user_id`) REFERENCES `users` (`id`) ON DELETE CASCADE ON UPDATE CASCADE
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_general_ci;

