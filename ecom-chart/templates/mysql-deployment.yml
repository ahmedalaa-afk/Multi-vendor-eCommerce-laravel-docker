apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.mysql.pvc.name}}
spec:
  accessModes:
    - {{ .Values.mysql.pvc.accessModes}}
  resources:
    requests:
      storage: {{ .Values.mysql.pvc.storage}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.mysql.name}}
spec:
  replicas: {{ .Values.mysql.replicas}}
  selector:
    matchLabels:
      app: {{ .Values.mysql.name}}
  template:
    metadata:
      labels:
        app: {{ .Values.mysql.name}}
    spec:
      containers:
        - name: {{ .Values.mysql.name}}
          image: {{ .Values.mysql.image}}
          ports:
            - containerPort: {{ .Values.mysql.containerPort}}
          env:
            - name: MYSQL_ALLOW_EMPTY_PASSWORD
              value: "true"
            - name: MYSQL_DATABASE
              value: "eCommerce"
            - name: MYSQL_ROOT_USER
              value: "root"
            - name: MYSQL_ROOT_PASSWORD
              value: ""
          volumeMounts:
            - name: db-storage
              mountPath: /var/lib/mysql
            - name: init-db
              mountPath: /docker-entrypoint-initdb.d/eCommerce.sql
              subPath: eCommerce.sql
      volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: db-pvc
        - name: init-db
          configMap:
            name: init-db
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.mysql.service.name}}
spec:
  type: {{ .Values.mysql.service.type}}
  selector:
    app: {{ .Values.mysql.name}}
  ports:
    - port: {{ .Values.mysql.service.port}}
      targetPort: {{ .Values.mysql.service.targetPort}}
